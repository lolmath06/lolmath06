<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Mathéo Dolmen — Turning ideas into real systems, products, and experiments.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090f"/>
      <stop offset="0.52" stop-color="#11111a"/>
      <stop offset="1" stop-color="#09090f"/>
    </linearGradient>
    <linearGradient id="accent" x1="-0.2" y1="0" x2="1.2" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.45" stop-color="#e879f9"/>
      <stop offset="0.72" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#38bdf8"/>
      <animate attributeName="x1" values="-0.2;0.25;-0.2" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1.2;0.75;1.2" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="orb">
      <stop offset="0" stop-color="#c084fc" stop-opacity=".35"/>
      <stop offset=".45" stop-color="#7c3aed" stop-opacity=".16"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#a855f7" stroke-opacity=".055"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="22" fill="url(#grid)"/>
  <circle cx="960" cy="112" r="220" fill="url(#orb)">
    <animate attributeName="r" values="205;235;205" dur="6s" repeatCount="indefinite"/>
  </circle>
  <path d="M0 292 C220 236 384 332 600 276 S1010 236 1200 272" fill="none" stroke="url(#accent)" stroke-width="2" opacity=".6">
    <animate attributeName="opacity" values=".35;.9;.35" dur="4s" repeatCount="indefinite"/>
  </path>

  <g transform="translate(72 54)">
    <text x="0" y="46" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="48" font-weight="800" letter-spacing="4">MATHÉO</text>
    <text x="250" y="46" fill="url(#accent)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="48" font-weight="800" letter-spacing="4" filter="url(#glow)">DOLMEN</text>
    <text x="2" y="91" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" letter-spacing="2.1">TURNING IDEAS INTO REAL SYSTEMS, PRODUCTS, AND EXPERIMENTS.</text>

    <g transform="translate(0 132)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">
      <g><rect width="128" height="38" rx="19" fill="#ffffff" fill-opacity=".035" stroke="#a855f7" stroke-opacity=".45"/><text x="64" y="24" text-anchor="middle" fill="#e9d5ff">FULL-STACK</text></g>
      <g transform="translate(144 0)"><rect width="116" height="38" rx="19" fill="#ffffff" fill-opacity=".035" stroke="#a855f7" stroke-opacity=".45"/><text x="58" y="24" text-anchor="middle" fill="#e9d5ff">SYSTEMS</text></g>
      <g transform="translate(276 0)"><rect width="156" height="38" rx="19" fill="#ffffff" fill-opacity=".035" stroke="#a855f7" stroke-opacity=".45"/><text x="78" y="24" text-anchor="middle" fill="#e9d5ff">CYBERSECURITY</text></g>
      <g transform="translate(448 0)"><rect width="72" height="38" rx="19" fill="#ffffff" fill-opacity=".035" stroke="#a855f7" stroke-opacity=".45"/><text x="36" y="24" text-anchor="middle" fill="#e9d5ff">AI</text></g>
    </g>

    <text x="2" y="235" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">5th-year Computer Science student · Epitech Paris</text>
  </g>

  <g transform="translate(930 80)">
    <circle cx="92" cy="74" r="70" fill="#0e0e17" stroke="url(#accent)" stroke-width="2.5"/>
    <circle cx="92" cy="74" r="58" fill="none" stroke="#a855f7" stroke-opacity=".18"/>
    <path d="M48 105V40l44 54 44-54v65" fill="none" stroke="url(#accent)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <path d="M72 48v58M112 48v58" stroke="#f8fafc" stroke-width="5" stroke-linecap="round" opacity=".88"/>
    <circle cx="92" cy="74" r="76" fill="none" stroke="#e879f9" stroke-opacity=".28">
      <animate attributeName="r" values="72;80;72" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".12;.48;.12" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>