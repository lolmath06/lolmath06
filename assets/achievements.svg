<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="GitHub achievement tracker">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset=".5" stop-color="#e879f9"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="250" rx="18" fill="#0b0b12" stroke="#272738"/>
  <text x="34" y="42" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="750">Achievement Tracker</text>
  <text x="34" y="66" fill="#8b93a7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Official GitHub achievements · unlocked and next targets</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(30 88)">
      <rect width="175" height="126" rx="14" fill="#12121c" stroke="#8b5cf6"/>
      <circle cx="31" cy="31" r="16" fill="#7c3aed" opacity=".22"/><text x="31" y="37" text-anchor="middle" font-size="18">🤪</text>
      <text x="56" y="27" fill="#f4f0ff" font-size="16" font-weight="700">YOLO</text>
      <text x="56" y="48" fill="#a78bfa" font-size="12">Unlocked</text>
      <path d="M24 89 l12 12 23-26" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
      <text x="73" y="100" fill="#d1fae5" font-size="13">MERGED</text>
    </g>

    <g transform="translate(221 88)">
      <rect width="175" height="126" rx="14" fill="#12121c" stroke="#e879f9"/>
      <circle cx="31" cy="31" r="16" fill="#e879f9" opacity=".18"/><text x="31" y="37" text-anchor="middle" font-size="18">🦈</text>
      <text x="56" y="27" fill="#f4f0ff" font-size="16" font-weight="700">Pull Shark</text>
      <text x="56" y="48" fill="#f0abfc" font-size="12">Unlocked · ×2</text>
      <rect x="24" y="82" width="127" height="8" rx="4" fill="#26263a"/><rect x="24" y="82" width="76" height="8" rx="4" fill="url(#g)"/>
      <text x="24" y="109" fill="#aab1c3" font-size="12">Next tier: long-term</text>
    </g>

    <g transform="translate(412 88)">
      <rect width="175" height="126" rx="14" fill="#12121c" stroke="#8b5cf6"/>
      <circle cx="31" cy="31" r="16" fill="#7c3aed" opacity=".22"/><text x="31" y="37" text-anchor="middle" font-size="18">🤠</text>
      <text x="56" y="27" fill="#f4f0ff" font-size="16" font-weight="700">Quickdraw</text>
      <text x="56" y="48" fill="#a78bfa" font-size="12">Unlocked</text>
      <path d="M24 89 l12 12 23-26" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="73" y="100" fill="#d1fae5" font-size="13">DONE</text>
    </g>

    <g transform="translate(603 88)">
      <rect width="175" height="126" rx="14" fill="#101018" stroke="#343448"/>
      <circle cx="31" cy="31" r="16" fill="#ffffff" opacity=".04"/><text x="31" y="37" text-anchor="middle" font-size="18">👯</text>
      <text x="56" y="27" fill="#ddd9e8" font-size="15" font-weight="700">Pair Extraordinaire</text>
      <text x="56" y="48" fill="#8b93a7" font-size="12">Next target</text>
      <text x="24" y="94" fill="#6b7280" font-size="13">Real co-authored PR</text>
    </g>

    <g transform="translate(794 88)">
      <rect width="175" height="126" rx="14" fill="#101018" stroke="#343448"/>
      <circle cx="31" cy="31" r="16" fill="#ffffff" opacity=".04"/><text x="31" y="37" text-anchor="middle" font-size="18">🧠</text>
      <text x="56" y="27" fill="#ddd9e8" font-size="16" font-weight="700">Galaxy Brain</text>
      <text x="56" y="48" fill="#8b93a7" font-size="12">Next target</text>
      <text x="24" y="94" fill="#6b7280" font-size="13">Accepted answers</text>
    </g>

    <g transform="translate(985 88)">
      <rect width="185" height="126" rx="14" fill="#101018" stroke="#343448"/>
      <circle cx="31" cy="31" r="16" fill="#ffffff" opacity=".04"/><text x="31" y="37" text-anchor="middle" font-size="18">⭐</text>
      <text x="56" y="27" fill="#ddd9e8" font-size="16" font-weight="700">Starstruck</text>
      <text x="56" y="48" fill="#facc15" font-size="12">1 / 16 stars</text>
      <rect x="24" y="82" width="137" height="8" rx="4" fill="#26263a"/><rect x="24" y="82" width="9" height="8" rx="4" fill="#facc15"/>
      <text x="24" y="109" fill="#6b7280" font-size="12">First tier</text>
    </g>
  </g>

  <rect x="0" y="0" width="1200" height="250" rx="18" fill="none" stroke="url(#g)" stroke-opacity=".12">
    <animate attributeName="stroke-opacity" values=".08;.28;.08" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>